// Shared by every versions/mcX project: one source tree (versions/mc26_1_2/src),
// compiled against the Minecraft version named by the project (mc26_2 -> *_26_2 properties).
// Tests live in, and run for, mc26_1_2 only.
// -Pmodrinth swaps in src/modrinth/java (KungBuild.MODRINTH = true) and builds into
// build/modrinth, so the two flavors never share class files.
def mc = project.name - "mc"
def minecraftVersion = property("minecraft_version_${mc}")
def fabricApiVersion = property("fabric_api_version_${mc}")
def modMenuVersion = property("modmenu_version_${mc}")
def oneConfigPlatform = property("oneconfig_platform_${mc}")
// 26.3's Fabric API needs a newer loader than the other versions; fabric_loader_version_<mc> overrides the default.
def loaderVersion = hasProperty("fabric_loader_version_${mc}") ? property("fabric_loader_version_${mc}") : fabric_loader_version
def flavor = hasProperty("modrinth") ? "modrinth" : "full"
def sharedSrc = rootProject.file("versions/mc26_1_2/src")

if (flavor == "modrinth") {
  layout.buildDirectory = layout.projectDirectory.dir("build/modrinth")
}

base {
  archivesName = flavor == "modrinth" ? "${mod_id}-modrinth-${minecraftVersion}" : "${mod_id}-${minecraftVersion}"
}

sourceSets {
  main {
    // src/version/java is the project's own McCompat: API that differs between Minecraft versions.
    java.srcDirs = [new File(sharedSrc, "main/java"), new File(sharedSrc, "${flavor}/java"), file("src/version/java")]
    resources.srcDirs = [new File(sharedSrc, "main/resources")]
    // McInput for GLFW input; a version with its own src/version McInput (26.3, SDL3) does not get it.
    if (!file("src/version/java/com/github/beng420/kung/compat/McInput.java").exists()) {
      java.srcDir(new File(sharedSrc, "glfw/java"))
    }
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = 25
}

repositories {
  maven {
    name = "Polyfrost"
    url = uri("https://repo.polyfrost.org/releases")
    content { includeGroup "org.polyfrost.oneconfig" }
  }
  maven {
    name = "Terraformers"
    url = uri("https://maven.terraformersmc.com/")
    content { includeGroup "com.terraformersmc" }
  }
}

dependencies {
  testImplementation "junit:junit:4.13.2"
  minecraft "com.mojang:minecraft:${minecraftVersion}"
  implementation "net.fabricmc:fabric-loader:${loaderVersion}"
  implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
  // Optional screen entrypoint; neither Mod Menu nor OneConfig is bundled or required.
  compileOnly("com.terraformersmc:modmenu:${modMenuVersion}") { transitive = false }
  ["config", "config-impl", "ui", "utils", "hud"].each { module ->
    compileOnly("org.polyfrost.oneconfig:${module}:1.2.0") { transitive = false }
    testImplementation("org.polyfrost.oneconfig:${module}:1.2.0") { transitive = false }
  }
  compileOnly("org.polyfrost.oneconfig:${oneConfigPlatform}:1.2.0") { transitive = false }
  compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.4.10"
  testImplementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.10"
  include implementation("com.googlecode.soundlibs:mp3spi:1.9.5.4")
  include implementation("com.googlecode.soundlibs:tritonus-share:0.3.7.4")
  include implementation("javazoom:jlayer:1.0.1")
}

def kungProfileDir = providers.gradleProperty("kungProfileDir")
  .orElse(providers.environmentVariable("KUNG_PROFILE_DIR"))
  .orElse(providers.environmentVariable("APPDATA").map { appData ->
    "${appData}\\ModrinthApp\\profiles\\Dungeons 26.1.2"
  })
def bundledDungeonScanDir = rootProject.layout.projectDirectory.dir("versions/mc26_1_2/src/main/resources/kung-dungeon-scans")
def localDungeonScanDir = kungProfileDir.map { profileDir -> file("${profileDir}/config/kung/dungeon-data") }
tasks.register("syncLocalDungeonRoomData") {
  group = "kung"
  description = "Copies locally learned dungeon room data from the active Modrinth profile into bundled jar resources."

  inputs.files(localDungeonScanDir.map { scanDir ->
    files(
      new File(scanDir, "known-rooms.json"),
      new File(scanDir, "known-room-preloads.jsonl"),
      new File(scanDir, "known-room-types.properties")
    )
  }).withPropertyName("localDungeonRoomData").optional()
  outputs.dir(bundledDungeonScanDir)

  doLast {
    File profileScanDir = localDungeonScanDir.get()
    File resourceScanDir = bundledDungeonScanDir.asFile
    if (!profileScanDir.exists()) {
      logger.lifecycle("No local dungeon room data found at ${profileScanDir}.")
      return
    }

    resourceScanDir.mkdirs()
    ["known-rooms.json", "known-room-preloads.jsonl", "known-room-types.properties"].each { name ->
      File target = new File(resourceScanDir, name)
      if (target.exists() && !target.delete()) {
        throw new GradleException("Failed to remove stale bundled dungeon room data file: ${target}")
      }
    }

    int copied = 0
    ["known-rooms.json", "known-room-preloads.jsonl", "known-room-types.properties"].each { name ->
      File source = new File(profileScanDir, name)
      if (source.exists()) {
        copy {
          from source
          into resourceScanDir
        }
        copied++
      }
    }

    logger.lifecycle("Synced ${copied} local dungeon room data file(s) from ${profileScanDir}.")
  }
}

processResources {
  inputs.property "version", project.version
  inputs.property "minecraft_version", minecraftVersion
  inputs.property "loader_version", loaderVersion

  filesMatching("fabric.mod.json") {
    expand(
      version: project.version,
      minecraft_version: minecraftVersion,
      loader_version: loaderVersion,
      mod_id: mod_id,
      mod_name: mod_name,
      mod_description: mod_description,
      mod_author: mod_author,
      mod_license: mod_license
    )
  }
}

tasks.named("test") {
  // A failing test prints its whole message, so a CI log names the line that differs (the golden tests say which).
  testLogging {
    exceptionFormat = "full"
  }
  workingDir = layout.buildDirectory.dir("test-run").get().asFile
  doFirst {
    workingDir.mkdirs()
  }
}

// Blood Rush, Mimic ESP, Skip NPC Dialogue, the Greenhouse supply's inventory swap and the experiment auto clicking
// (Chronomatron, Ultrasequencer, Superpairs Auto Reveal) and Auto Harp are not in the Modrinth jar.
// Every use of these classes sits in if (!KungBuild.MODRINTH), which javac drops; the check fails the build if
// one slips through.
def modrinthCut = [
  "feature/dungeon/BloodRushHelperFeature", "feature/dungeon/BloodRushDoorEstimate",
  "feature/dungeon/DungeonMimicEspFeature", "feature/dungeon/DungeonMimicChestScanner",
  "feature/dungeon/DungeonMimicStaticChests", "feature/dungeon/DungeonMimicChestMemory",
  "feature/dungeon/DungeonStaticChestCatalog", "feature/dungeon/DungeonStaticChestPattern",
  "feature/misc/NpcDialogueSkipFeature",
  "feature/garden/GreenhouseSupplySwap",
  "feature/experiment/ExperimentAutoClicker", "feature/experiment/AutoPacer",
  "feature/misc/SuperpairsAutoReveal",
  "feature/misc/AutoHarpFeature", "feature/misc/HarpPlanner",
  "command/MimicCommandGroup"
].collect { "com/github/beng420/kung/${it}" }
def modrinthCutResources = ["kung-dungeon-scans/static-trapped-chests.json", "kung-npc-dialogue-choices.json"]

if (flavor == "modrinth") {
  tasks.named("jar") {
    modrinthCut.each { exclude("${it}.class", "${it}\$*.class") }
    exclude(modrinthCutResources)
    doLast {
      def leaks = []
      new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { zip ->
        zip.entries().toList().findAll { it.name.endsWith(".class") }.each { entry ->
          String bytes = new String(zip.getInputStream(entry).readAllBytes(), "ISO-8859-1")
          modrinthCut.findAll { bytes.contains(it) }.each { leaks << "${entry.name} -> ${it}" }
        }
      }
      if (leaks) throw new GradleException("The Modrinth jar still uses cut classes:\n" + leaks.join("\n"))
    }
  }
}
