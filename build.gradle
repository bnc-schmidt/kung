plugins {
  id "net.fabricmc.fabric-loom" version "${loom_version}" apply false
}

allprojects {
  group = maven_group
  version = mod_version
}

// Only the real mcX projects; the :versions container has no sources.
configure(project(":versions").subprojects) {
  apply plugin: "java"

  tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
  }
}
