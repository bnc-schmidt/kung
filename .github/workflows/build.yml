name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mod:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test both Minecraft versions
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build

  server:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test the room sync server
        run: node --test deploy/kung-room-sync/kung-room-sync-server.test.mjs
